# Veröffentlicht die App auf GitHub Pages – bei jedem Push auf main. Kein Bauschritt, die Dateien gehen so raus, wie sie sind.
name: Pages
on:
  push:
    branches: [main]
    paths-ignore: ["bruecke/**"]   # Briefkasten Zoro ⇄ Sanji: löst keine neue Veröffentlichung aus
  # 18.10.2026: Vorschläge von Gemini/Jules kommen als Pull Request – Tests laufen mit, veröffentlicht wird nur von main
  pull_request:
    branches: [main, sanji/facelift-1-0-integration, "work/**", "zoro/**"]   # 23.10.2026: gestapelte PRs gegen Work- und Zoro-Branches prüfen
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Erst prüfen, dann veröffentlichen: schlägt ein Test fehl, geht nichts live (Befund E05 aus Sanjis Prüfung)
  test:
    runs-on: ubuntu-24.04  # fest: ubuntu-latest wechselt ab 19.10.2026 auf Ubuntu 26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 18.10.2026: Tests in zwei Zeitzonen – der Laden lebt in deutscher Zeit, der Testrechner in UTC
      - run: TZ=UTC node --test tests/*.mjs
      - run: TZ=Europe/Berlin node --test tests/*.mjs
  # 17.10.2026 (Paket 7): Regelprüfung und Personal-Durchlauf im echten Browser. Seit 17.10. mittags blockierend
  # (5 stabile Läufe): neue Regelverstöße oder ein kaputter Personal-Modus gehen nicht mehr live.
  regeln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      # Befunde als Anmerkungen (lesbar ohne Log-Download). Ein Browser-Lauf darf einmal wiederholt werden:
      # GitHub-Rechner sind langsam beim ersten Service-Worker-Start (2 von 7 Läufen am 17.10. mit Zeitüberschreitung).
      # Schlägt auch der zweite Lauf fehl, blockiert der Job den Deploy.
      - name: Regelprüfung
        run: |
          for versuch in 1 2; do
            if python tests/regeln.py > regeln.txt 2>&1; then grep -E "Verletzungen" regeln.txt | while read -r l; do echo "::notice::regeln: $l"; done; exit 0; fi
            grep -E "Error|assert|Timeout|Fehler" regeln.txt | tail -8 | while read -r l; do echo "::warning::regeln Versuch $versuch: $l"; done
          done
          echo "SANJI Bildschirm-Diagnose:"
          tail -110 regeln.txt
          exit 1
      # Zoro 23.10.2026: auch für gestapelte PRs (Basis work/…, zoro/…) – PR #7 lief vorher nie durch diesen Schritt.
      - name: Beide Piloten, Sprachen, Sicherung und Offline
        if: github.event_name == 'pull_request' && (github.base_ref == 'sanji/facelift-1-0-integration' || startsWith(github.base_ref, 'work/') || startsWith(github.base_ref, 'zoro/'))
        run: python tests/work_integration_browser.py
      # Facelift-Abnahme: echte Browser-Aufnahmen der App statt KI-Mockups.
      # Nur Pull Requests: kein Einfluss auf den Live-Deploy.
      - name: Facelift Browser-Screenshots vorbereiten
        if: always() && github.event_name == 'pull_request'
        run: |
          mkdir -p tests/facelift-artifacts
          if test -d ../audit/regeln; then find ../audit/regeln -maxdepth 1 -name '*.png' -print0 | xargs -0 -r -I{} cp "{}" tests/facelift-artifacts/; fi
          if test -f tests/regeln_stand.json; then cp tests/regeln_stand.json tests/facelift-artifacts/; fi
      - name: Facelift Browser-Screenshots sichern
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: facelift-browser-${{ github.run_id }}
          path: tests/facelift-artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Personal-Durchlauf
        run: |
          for versuch in 1 2; do
            if python tests/durchlauf_personal.py > personal.txt 2>&1; then exit 0; fi
            grep -E "Error|assert|Timeout|Fehler" personal.txt | tail -8 | while read -r l; do echo "::warning::personal Versuch $versuch: $l"; done
          done
          exit 1
  deploy:
    needs: [test, regeln]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Nur die App geht auf die Seite (Entscheidung Baris 16.10.2026, E6): kein bruecke/, tests/, design/, tools/, .github/
      - name: App-Dateien zusammenstellen
        run: |
          mkdir -p /tmp/seite
          cp -r index.html sw.js manifest.webmanifest LIZENZEN-SYMBOLE.txt README.md js css bilder foto fonts icons vendor design assets /tmp/seite/
          echo "Dateien auf der Seite: $(find /tmp/seite -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/seite
      - id: deployment
        uses: actions/deploy-pages@v4
