# Veröffentlicht die App auf GitHub Pages – bei jedem Push auf main. Kein Bauschritt, die Dateien gehen so raus, wie sie sind.
name: Pages
on:
  push:
    branches: [main]
    paths-ignore: ["bruecke/**"]   # Briefkasten Zoro ⇄ Sanji: löst keine neue Veröffentlichung aus
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Erst prüfen, dann veröffentlichen: schlägt ein Test fehl, geht nichts live (Befund E05 aus Sanjis Prüfung)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.mjs
  # 17.10.2026 (Paket 7): Regelprüfung und Personal-Durchlauf im echten Browser. Seit 17.10. mittags blockierend
  # (5 stabile Läufe): neue Regelverstöße oder ein kaputter Personal-Modus gehen nicht mehr live.
  regeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      # Befunde zusätzlich als Anmerkungen (lesbar ohne Log-Download): jede Zeile mit NEU, Verletzungen, Fehler
      - run: |
          set -o pipefail
          python tests/regeln.py 2>&1 | tee regeln.txt || { grep -E "NEU|neu:|Verletzungen|Error|Traceback|assert" regeln.txt | tail -20 | while read -r l; do echo "::warning::regeln: $l"; done; exit 1; }
          grep -E "Verletzungen" regeln.txt | while read -r l; do echo "::notice::regeln: $l"; done
      - run: |
          set -o pipefail
          python tests/durchlauf_personal.py 2>&1 | tee personal.txt || { tail -15 personal.txt | while read -r l; do echo "::warning::personal: $l"; done; exit 1; }
  deploy:
    needs: [test, regeln]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Nur die App geht auf die Seite (Entscheidung Baris 16.10.2026, E6): kein bruecke/, tests/, design/, tools/, .github/
      - name: App-Dateien zusammenstellen
        run: |
          mkdir -p /tmp/seite
          cp -r index.html sw.js manifest.webmanifest LIZENZEN-SYMBOLE.txt README.md js css bilder foto fonts icons vendor design /tmp/seite/
          echo "Dateien auf der Seite: $(find /tmp/seite -type f | wc -l)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/seite
      - id: deployment
        uses: actions/deploy-pages@v4
