<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GastroCash · Zeki</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/zeki.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--tinte);font:16px/1.5 var(--schrift)}button,select{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:3px solid var(--fokus);outline-offset:4px}.page{max-width:1120px;margin:auto;padding:40px 24px}.top{display:flex;justify-content:space-between;gap:24px;align-items:start}.overline{font-size:12px;font-weight:750;letter-spacing:.14em;color:var(--tinte-weich);text-transform:uppercase}h1{font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.045em;margin:16px 0}h2{font-size:18px;margin:0}.intro{max-width:660px;color:var(--tinte-weich)}select{min-height:56px;background:var(--weiss);color:var(--tinte);border:1px solid var(--holz-tief);border-radius:var(--radius);padding:12px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:32px 0 24px}.card{background:var(--weiss);border:1px solid var(--holz);border-radius:var(--radius);box-shadow:var(--schatten-karte);overflow:hidden}.card>header{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:16px 24px;border-bottom:1px solid var(--holz)}.stage{height:400px;display:grid;place-items:center;overflow:hidden;background:var(--papier);position:relative}.reference{width:264px;height:366px;overflow:hidden;position:relative}.reference img{position:absolute;width:3072px;height:1714.5px;max-width:none;left:-1455px;top:-922.5px}.live-figure{height:366px;width:340px;display:grid;place-items:center}.live-figure svg{width:264px;height:366px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.controls button{border:1px solid var(--holz-tief);background:var(--weiss);color:var(--tinte);border-radius:var(--radius);min-height:64px;font-weight:700;padding:12px}.controls button:active{background:var(--salbei-hell)}.states{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:24px 0}.states .wordmark{font-size:30px;letter-spacing:-1px;font-weight:350}.wordmark strong{font-weight:800}.notes{margin-top:32px;padding:24px;background:var(--salbei-hell);border-radius:var(--radius);color:var(--salbei-tief)}.notes p{margin:0 0 12px}.notes p:last-child{margin:0}.full-reference{margin-top:32px}.full-reference img{display:block;width:100%;height:auto;border-radius:var(--radius)}.state-label{font-size:12px;color:var(--tinte-weich)}@media(max-width:650px){.page{padding:24px 12px}.comparison{gap:8px;margin-top:24px}.card>header{padding:12px;min-height:64px}.card h2{font-size:14px}.stage{height:270px}.reference{transform:scale(.67);flex:none}.live-figure{transform:scale(.67)}.controls{grid-template-columns:repeat(2,1fr)}.top{gap:12px}.stage{display:flex;align-items:center;justify-content:center}.comparison .card{min-width:0}.states{flex-wrap:wrap}.reference{width:264px;min-width:264px}.live-figure{width:340px;min-width:340px}}
</style>
</head>
<body><main class="page"><header class="top"><div><div class="overline">GastroCash · 28.10.2026</div><h1 data-t="animationTitle"></h1><p class="intro" data-t="animationIntro"></p></div><select id="language" aria-label="Sprache"><option value="de">Deutsch</option><option value="tr">Türkçe</option><option value="en">English</option></select></header>
<div class="comparison" id="comparison"><section class="card"><header><h2 data-t="reference"></h2></header><div class="stage"><div class="reference"><img src="referenz/zeki-brand-2026.jpeg" alt="Zeki"></div></div></section><section class="card"><header><h2 data-t="live"></h2><span id="state-label" class="state-label"></span></header><div class="stage"><div class="live-figure" id="live"></div></div></section></div>
<div class="controls" id="controls"></div><div class="states"><span class="wordmark">Gastro<strong>Cash</strong></span><select id="state" aria-label="Zeki"><option value="neutral" data-t="neutral"></option><option value="freude" data-t="freude"></option><option value="nachdenklich" data-t="nachdenklich"></option><option value="warnung" data-t="warnung"></option></select></div>
<div class="notes"><p data-t="motionNote"></p></div><div class="full-reference"><img src="referenz/zeki-brand-2026.jpeg" alt="GastroCash"></div>
</main>
<script type="module">
import {mascotMarkup,zekiSpielen} from '../js/gastrocash-brand.js';
import {sanjiDesign as de} from '../js/lang/de.js';import {sanjiDesign as tr} from '../js/lang/tr.js';import {sanjiDesign as en} from '../js/lang/en.js';
const tables={de,tr,en};let active='de';let state='neutral';let reference=true;const t=k=>tables[active][k];const movements=['zwinkern','grinsen','hand','nicken','kopfschuetteln','atmen'];const live=document.querySelector('#live');
function figure(){document.querySelector('#state').value=reference?'freude':state;live.innerHTML=mascotMarkup(reference?'freude':state);if(reference)live.firstElementChild.classList.add('zeki--referenz');document.querySelector('#state-label').textContent=reference?t('reference'):t(state);}
function render(){document.documentElement.lang=active;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelector('#controls').innerHTML=movements.map(m=>`<button type="button" data-motion="${m}">${t(m)}</button>`).join('');figure();}
document.querySelector('#language').addEventListener('change',e=>{active=e.target.value;render();});document.querySelector('#state').addEventListener('change',e=>{reference=false;state=e.target.value;figure();});document.querySelector('#controls').addEventListener('click',e=>{const motion=e.target.closest('[data-motion]')?.dataset.motion;if(!motion)return;if(reference){reference=false;figure();}zekiSpielen(live,motion);});render();
// Für reproduzierbare PR-Aufnahmen; kein Zustand der App wird verändert.
window.zekiAbnahme={spielen:motion=>{reference=false;figure();return zekiSpielen(live,motion);},referenz:()=>{reference=true;figure();}};
</script></body></html>
