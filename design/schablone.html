<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GastroCash · Schablone</title>
<link rel="stylesheet" href="../css/tokens.css">
<!-- CSS: ausschließlich Farben und Schrift aus den vorhandenen Tokens. -->
<style>
*{box-sizing:border-box}body{margin:0;background:var(--papier);color:var(--tinte);font:16px/1.5 var(--schrift)}button,input,select{font:inherit;color:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--fokus);outline-offset:4px}a{color:inherit}.top{max-width:1320px;margin:auto;padding:40px 24px 20px;display:flex;justify-content:space-between;align-items:start;gap:24px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--tinte-weich);font-weight:700}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-.045em;line-height:1.08;margin:16px 0}h2{font-size:24px;letter-spacing:-.03em;line-height:1.2}h3{font-size:16px;margin:0 0 16px}p{color:var(--tinte-weich)}select{border:1px solid var(--holz-tief);border-radius:var(--radius);background:var(--weiss);min-height:56px;padding:10px}.links{max-width:1320px;display:flex;gap:8px;flex-wrap:wrap;margin:auto;padding:0 24px 24px}.links a{padding:12px 20px;border-radius:99px;border:1px solid var(--holz);text-decoration:none;font-weight:600;min-height:56px;display:flex;align-items:center}.links a:hover{background:var(--weiss)}.gallery{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:8px 24px 48px}.sample-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.sample-title h2{margin:0}.badge{font-size:12px;font-weight:650;color:var(--salbei-tief);background:var(--salbei-hell);padding:6px 12px;border-radius:99px}.phone-wrap{overflow:auto;border-radius:var(--radius)}.phone{width:390px;height:844px;position:relative;overflow:hidden;isolation:isolate;background:var(--papier);border:1px solid var(--holz);border-radius:var(--radius);box-shadow:var(--schatten-karte)}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:80px;background:var(--weiss);padding:8px 12px;border-bottom:1px solid var(--holz)}.logo{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:350;letter-spacing:-1.2px;white-space:nowrap}.logo strong{font-weight:800}.circle{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;border:0;background:transparent;color:var(--salbei-tief);font-weight:600;font-size:24px}.circle.help{background:var(--salbei-hell)}.icon{width:26px;height:26px;display:block;flex:none}.reference-bot{position:relative;overflow:hidden;display:block;width:36px;height:52px;flex:none}.reference-bot img{position:absolute;width:454px;max-width:none;height:auto;left:-215px;top:-137px}.content{padding:24px 16px;display:flex;flex-direction:column;gap:16px;height:674px}.hero{height:318px;border-radius:var(--radius);padding:24px 20px;color:var(--weiss);background:linear-gradient(90deg,var(--salbei-tief),transparent),linear-gradient(0deg,var(--salbei-tief),transparent),url('../foto/hero-doenergrill.webp') center/cover;position:relative;overflow:hidden}.hero .goal{font-size:20px}.number{display:block;font-weight:850;letter-spacing:-.055em;font-size:52px;line-height:1.08;margin:12px 0;font-variant-numeric:var(--zahlen)}.curve{width:100%;height:150px;display:block;color:var(--weiss);margin-top:12px}.curve text{fill:currentColor;font:13px var(--schrift)}.benefit{background:var(--salbei-hell);color:var(--salbei-tief);border-radius:var(--radius);min-height:56px;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:650}.benefit b{font-size:22px;font-variant-numeric:var(--zahlen)}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:88px;border-radius:var(--radius);background:var(--weiss);box-shadow:var(--schatten-karte);border:1px solid var(--holz);font-size:13px;font-weight:650;padding:8px 2px}.tile .icon{width:28px;height:28px;color:var(--salbei-tief)}.primary{width:100%;min-height:64px;border:0;border-radius:var(--radius);background:var(--aktion);color:var(--aktion-text);box-shadow:var(--schatten-knopf);font-size:19px;font-weight:750;padding:14px 16px}.content>.primary{margin-top:auto}.bottom{position:absolute;bottom:0;inset-inline:0;display:grid;grid-template-columns:repeat(5,1fr);height:88px;padding:8px 4px 16px;border-top:1px solid var(--holz);background:var(--weiss)}.bottom button{border:0;background:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;min-height:56px;font-size:12px;color:var(--tinte-weich);font-weight:600}.bottom .active{color:var(--salbei-tief);background:var(--salbei-hell);border-radius:var(--radius)}.bottom .icon{width:24px;height:24px}.office .head{justify-content:start;gap:20px}.office .content{height:auto;padding-top:32px}.office h2{font-size:32px;margin:0;line-height:1.1}.office p{margin:0 0 8px}.office-list,.office-card{border-radius:var(--radius);background:var(--weiss);box-shadow:var(--schatten-karte);overflow:hidden}.office-list button{border:0;border-bottom:1px solid var(--papier-tief);background:none;display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;min-height:72px;font-weight:600;text-align:start}.office-list button:last-child{border-bottom:0}.office-list span:last-child{color:var(--tinte-weich)}.office-card{padding:20px}.office-card h3{font-size:23px;margin:0 0 12px}.office-card .primary{margin-top:20px}.secondary{min-height:56px;border:1px solid var(--holz-tief);border-radius:var(--radius);background:var(--weiss);width:100%;font-weight:650;padding:10px 16px;margin-top:12px}.scrim{position:absolute;inset:0;background:var(--tinte);opacity:.35}.sheet{position:absolute;bottom:0;inset-inline:0;border-radius:var(--radius-gross) var(--radius-gross) 0 0;background:var(--weiss);padding:12px 24px 32px;display:flex;gap:24px;flex-direction:column;box-shadow:var(--schatten-karte)}.handle{width:40px;height:4px;background:var(--holz-tief);border-radius:99px;margin:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.sheet h2{font-size:28px;margin:0}.sheet .circle{width:56px;height:56px}.amount{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--holz-tief);padding-bottom:16px}.amount input{width:100%;font-size:52px;font-weight:800;letter-spacing:-.045em;border:0;background:transparent;min-height:64px;min-width:0}.amount span{font-size:32px}.brand{max-width:1272px;margin:16px auto 48px;background:var(--weiss);border-radius:var(--radius-gross);padding:40px;box-shadow:var(--schatten-karte)}.brand-intro{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center;padding-bottom:40px;border-bottom:1px solid var(--holz)}.brand h2{font-size:clamp(28px,4vw,44px);margin-top:8px}.brand-figure{display:flex;align-items:center;justify-content:center;gap:32px;background:var(--papier);padding:24px;border-radius:var(--radius)}.brand-bot{width:156px;height:240px;position:relative;overflow:hidden;flex:none}.brand-bot img{position:absolute;max-width:none;width:2048px;height:1143px;left:-976px;top:-615px}.app-icon{width:128px;height:128px;position:relative;overflow:hidden;border-radius:28px}.app-icon img{position:absolute;max-width:none;width:487px;height:auto;left:-55px;top:-105px}.wordmark{max-width:500px;height:80px;overflow:hidden;position:relative;margin:16px 0}.wordmark img{position:absolute;max-width:none;width:1365px;height:762px;left:-770px;top:-460px}.specs{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:32px 0}.specs p{font-size:15px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.swatch{height:64px;border-radius:var(--radius-klein);border:1px solid var(--holz);margin-bottom:8px}.colour{font-size:12px;overflow-wrap:anywhere}.colour code{display:block;color:var(--tinte-weich)}.tone{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;padding-left:24px}.tone li{padding:12px 0;border-bottom:1px solid var(--papier-tief)}.icon-strip{display:flex;gap:24px;flex-wrap:wrap}.icon-strip>div{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:80px}.icon-strip .icon{width:32px;height:32px;color:var(--salbei-tief)}footer{max-width:1272px;margin:0 auto 48px;padding:0 24px;color:var(--tinte-weich);font-size:14px}.notice{background:var(--salbei-hell);border-radius:var(--radius);padding:20px;margin:24px 0}.preview-overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--papier);z-index:10;padding:24px}.preview-overlay[hidden]{display:none}.preview-overlay>div{max-width:420px;padding:32px;background:var(--weiss);border-radius:var(--radius);box-shadow:var(--schatten-karte)}@media(max-width:1200px){.gallery{grid-template-columns:repeat(3,390px);overflow-x:auto}.brand{margin:16px 24px 48px}.brand-intro{grid-template-columns:1fr 1fr}.brand-figure{gap:12px;padding:12px}}@media(max-width:760px){.top{padding-top:24px}.gallery{display:flex;flex-direction:column;align-items:center;overflow:visible;padding:0 0 32px}.sample{max-width:100%}.phone-wrap{max-width:100vw}.sample-title{padding:0 12px}.brand{padding:24px;margin:0 12px 32px}.brand-intro,.specs{grid-template-columns:1fr;gap:24px}.brand-figure{justify-content:space-around}.palette{grid-template-columns:repeat(3,1fr)}.tone{grid-template-columns:1fr}.wordmark{transform-origin:left center;max-width:100%;zoom:.66}}
</style>
</head>
<body>
<header class="top"><div><div class="eyebrow">GastroCash · 27.10.2026</div><h1 data-t="title"></h1><p data-t="intro"></p></div><select id="language" aria-label="Sprache"><option value="de">Deutsch</option><option value="tr">Türkçe</option><option value="en">English</option></select></header>
<nav class="links"><a href="#laden" data-t="laden"></a><a href="#buero" data-t="buero"></a><a href="#blatt" data-t="blatt"></a><a href="#marke" data-t="marke"></a></nav>
<main>
<div class="gallery">
<section class="sample" id="laden"><div class="sample-title"><h2 data-t="laden"></h2><span class="badge" data-t="example"></span></div><div class="phone-wrap"><article class="phone shop" aria-label="Laden" id="shop"></article></div></section>
<section class="sample" id="buero"><div class="sample-title"><h2 data-t="buero"></h2><span class="badge" data-t="example"></span></div><div class="phone-wrap"><article class="phone office" id="office"></article></div></section>
<section class="sample" id="blatt"><div class="sample-title"><h2 data-t="blatt"></h2><span class="badge" data-t="example"></span></div><div class="phone-wrap"><article class="phone" id="dialog"></article></div></section>
</div>
<section class="brand" id="marke">
<div class="brand-intro"><div><div class="eyebrow" data-t="marke"></div><h2 data-t="brandTitle"></h2><p data-t="brandSub"></p><h3 data-t="wordmark"></h3><div class="wordmark"><img src="referenz/zeki-brand-2026.jpeg" alt="GastroCash"></div></div><div class="brand-figure"><div class="brand-bot"><img src="referenz/zeki-brand-2026.jpeg" alt="Zeki"></div><div><div class="app-icon"><img src="referenz/zeki-brand-2026.jpeg" alt="GastroCash"></div><p data-t="appIcon"></p></div></div></div>
<div class="specs"><div><h3 data-t="type"></h3><p data-t="typeDesc"></p><div class="number">1.280 €</div></div><div><h3 data-t="spacing"></h3><p data-t="spaceDesc"></p><div class="notice" data-t="rule"></div></div></div>
<h3 data-t="palette"></h3><div class="palette" id="palette"></div>
<div class="specs"><div><h3 data-t="icons"></h3><div class="icon-strip" id="icons"></div></div><div><h3 data-t="voice"></h3><ol class="tone" id="tone"></ol></div></div>
</section>
</main>
<footer><p data-t="noStorage"></p><p data-t="approved"></p></footer>
<div class="preview-overlay" id="preview" hidden role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div><h2 id="previewTitle" data-t="example"></h2><p data-t="noStorage"></p><button type="button" class="primary" data-close data-t="close"></button></div></div>
<!-- JS: nur Vorschau und Sprachwechsel; keine Speicherung, keine Nutzenrechnung. -->
<script type="module">
import { sanjiDesign as de } from '../js/lang/de.js';
import { sanjiDesign as tr } from '../js/lang/tr.js';
import { sanjiDesign as en } from '../js/lang/en.js';
const tabs={de,tr,en};let active='de';const t=k=>tabs[active][k];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=id=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><use href="../assets/brand/heute-icons.svg#${id}"></use></svg>`;
const bot=()=>'<span class="reference-bot"><img src="referenz/zeki-brand-2026.jpeg" alt=""></span>';
const logo=()=>`<span class="logo" aria-label="GastroCash">${bot()}<span>Gastro<strong>Cash</strong></span></span>`;
const header=()=>`<header class="head"><button type="button" class="circle" data-demo aria-label="${t('menu')}">☰</button>${logo()}<button type="button" class="circle help" data-demo aria-label="${t('help')}">?</button></header>`;
const entries=[['umsatz','revenue'],['muell','waste'],['kuehlung','cool'],['putzen','clean']];
const bottom=()=>`<nav class="bottom">${[['heute','today'],...entries.slice(1),['karte','card']].map(([i,k],n)=>`<button type="button" data-demo class="${n===0?'active':''}"${n===0?' aria-current="page"':''}>${icon(i)}<span>${t(k)}</span></button>`).join('')}</nav>`;
const shop=()=>`${header()}<div class="content"><section class="hero"><span class="goal">${t('goal')}</span><b class="number">1.280 €</b><svg class="curve" viewBox="0 0 320 150" aria-hidden="true"><path d="M0 42H320" fill="none" stroke="currentColor" stroke-dasharray="5 6" opacity=".5"/><text x="320" y="30" text-anchor="end">12.000 €</text><path d="M0 135 32 129 64 116 96 112 128 92 160 88 192 72 224 57 254 50V150H0Z" fill="currentColor" opacity=".13"/><path d="M0 135 32 129 64 116 96 112 128 92 160 88 192 72 224 57 254 50" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="254" cy="50" r="5" fill="currentColor"/></svg></section><div class="benefit"><span>${t('saved')}</span><b>84 €</b></div><div class="tiles">${entries.map(([i,k])=>`<button type="button" class="tile" data-demo>${icon(i)}<span>${t(k)}</span></button>`).join('')}</div><button type="button" class="primary" data-demo>${t('enter')}</button></div>${bottom()}`;
function render(){document.documentElement.lang=active;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelector('#shop').innerHTML=shop();document.querySelector('#office').innerHTML=`<header class="head"><button type="button" class="circle" data-demo aria-label="${t('back')}">‹</button><b>${t('buero')}</b></header><div class="content"><h2>${t('officeTitle')}</h2><p>${t('officeSub')}</p><h3>${t('records')}</h3><div class="office-list">${['health','tax','book'].map(k=>`<button type="button" data-demo><span>${t(k)}</span><span aria-hidden="true">›</span></button>`).join('')}</div><h3>${t('numbers')}</h3><section class="office-card"><h3>${t('costs')}</h3><p>${t('costSub')}</p><button type="button" class="primary" data-demo>${t('edit')}</button><button type="button" class="secondary" data-demo>${t('export')}</button></section></div>`;document.querySelector('#dialog').innerHTML=`<div aria-hidden="true" inert>${shop()}</div><div class="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="handle" aria-hidden="true"></div><div class="sheet-head"><h2 id="sheet-title">${t('revenue')}</h2><button type="button" class="circle" data-demo aria-label="${t('close')}">×</button></div><label class="amount"><input aria-label="${t('amount')}" inputmode="decimal" value="460,00"><span>€</span></label><button type="button" class="primary" data-demo>${t('save')}</button></section>`;document.querySelector('#tone').innerHTML=t('sentences').map(s=>`<li>${esc(s)}</li>`).join('');document.querySelector('#icons').innerHTML=[...entries,['karte','card']].map(([i,k])=>`<div>${icon(i)}<span>${t(k)}</span></div>`).join('');const css=getComputedStyle(document.documentElement);document.querySelector('#palette').innerHTML=['papier','papier-tief','weiss','tinte','tinte-weich','salbei','salbei-tief','salbei-hell','holz','holz-tief','lehm','glut','gelb','rot','gruen'].map(name=>`<div class="colour"><div class="swatch" style="background:var(--${name})"></div>${name}<code>${css.getPropertyValue('--'+name).trim().split(';')[0]}</code></div>`).join('');}
let previous;const preview=document.querySelector('#preview');document.querySelector('#language').addEventListener('change',e=>{active=e.target.value;render();});document.addEventListener('click',e=>{if(e.target.closest('[data-demo]')){previous=e.target.closest('button');preview.hidden=false;preview.querySelector('button').focus();}if(e.target.closest('[data-close]')){preview.hidden=true;previous?.focus();}});document.addEventListener('keydown',e=>{if(!preview.hidden&&e.key==='Escape'){preview.hidden=true;previous?.focus();}if(!preview.hidden&&e.key==='Tab'){e.preventDefault();preview.querySelector('button').focus();}});render();
</script>
</body>
</html>
