<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GastroCalc Baukasten</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    /* Nur der Rahmen dieser Seite. Die App-Optik kommt allein aus tokens.css und app.css. */
    .bk-kopf { padding: 16px; font: 15px/1.4 system-ui, sans-serif; }
    .bk-kopf a { margin: 0 4px; }
    #baukasten { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px; align-items: flex-start; }
    .bk-teil { width: 390px; max-width: 100%; }
    .bk-titel { font: 600 14px/1.3 system-ui, sans-serif; margin: 0 0 8px; }
    .bk-handy { border: 1px solid #999; border-radius: 12px; overflow: hidden; height: 780px; overflow-y: auto; background: var(--papier); }
    .bk-handy .pkt { display: inline-block; }
    .bk-handy { transform: translateZ(0); position: relative; } /* feste Elemente (Menü, Schnellknopf, Blatt) bleiben im Handy-Rahmen */
  </style>
</head>
<body>
  <div class="bk-kopf">
    <b>Baukasten für die Optik</b>: alle Bildschirme mit Beispieldaten. Knöpfe tun hier nichts. Sprache: <span id="sprachen"></span><br>
    Regeln: <code>bruecke/visual-vertrag.md</code>. Geändert werden nur <code>css/tokens.css</code>, <code>css/app.css</code>, <code>bilder/</code>, <code>icons/</code>.
  </div>
  <main id="baukasten"><p>Lädt …</p></main>
  <script type="module" src="baukasten.js"></script>
</body>
</html>
